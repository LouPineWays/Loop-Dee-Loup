name: Control-plane paths

# Guards against the exact drift found by three consecutive Stage 2 audits (issues
# #37, #39, #41): a real control-plane path silently missing from the enumeration in
# docs/bounded-review-cycle.md. No build step and no dependencies, so it stays cheap
# to run on every PR that could plausibly move a control-plane path.
on:
  pull_request:
    branches: [main]
    paths:
      - "*.md"
      - "docs/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/**"
      - ".claude/**"
      - "tools/burn-order/**"
      - "docs/burn-order.json"
      - "tools/check-control-plane-paths.mjs"
      - "tools/local-worker/**"
      - "tools/review-watch/**"
      - "tools/telemetry/**"
      - "tools/ldl-init/**"
      - "tools/ldl-update/**"

concurrency:
  group: control-plane-paths-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify control-plane path list
        run: node tools/check-control-plane-paths.mjs

      - name: Local-worker adapter tests
        run: node --test tools/local-worker/adapter.test.mjs

      - name: Review-watch tests
        run: node --test tools/review-watch/*.test.mjs

      - name: Telemetry collector/reducer tests
        run: node --test tools/telemetry/*.test.mjs

      - name: LDL-init bootstrap tests
        run: node --test tools/ldl-init/index.test.mjs

      - name: LDL-update tests
        run: node --test tools/ldl-update/index.test.mjs
