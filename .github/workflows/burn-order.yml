name: Burn Order

# Deliberately its own workflow rather than folded into some future main CI workflow: it needs
# no build step and no dependencies, so it finishes in seconds and can run on doc-only PRs.
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/burn-order.json"
      - "tools/burn-order/**"
      - ".github/workflows/burn-order.yml"

concurrency:
  group: burn-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, because the verifier resolves each done-ref against real commits.
          # At the default depth of 1 every ref would look broken.
          fetch-depth: 0

      - name: Verify the burn order
        run: node tools/burn-order/verify.mjs
