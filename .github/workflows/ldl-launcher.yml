name: LDL launcher

# Thin GitHub-native adapter for issue #73. All decisions live in the pure modules
# tools/orchestration/launch-authorization.mjs, attempt-claim.mjs and launcher-step.mjs; this file
# reads durable GitHub state, calls them, posts the attempt claim, runs the launcher step
# (tools/orchestration/launcher-run.mjs: the supervisor loop), and settles the claim once a
# genuine terminal, waiting, or fail-closed boundary is reached.
#
# A control-issue-only workflow_dispatch (Run workflow, issue #1094) is the one-action launch REQUEST:
# the pressing actor's live write permission is verified, the sole execution issue is resolved from
# the session-entry gate verdict (never typed), the request nonce is derived from the run id, and an
# auditable `## Launch Request (v1)` record precedes the claim. A dispatch that supplies a nonce
# keeps the legacy comment-authorized path.
#
# A Launch Authorization comment is a launch REQUEST, never execution authority: the launcher step
# derives mutation authority from the gate verdict's own execution-authority envelope and refuses
# any verdict that does not belong to the requested control/execution issue.
#
# Security posture:
#   - Triggers are issue_comment (created) and workflow_dispatch only; no pull_request or
#     pull_request_target, and PR comments are rejected by the module.
#   - A manual dispatch selected on a non-default ref is skipped at the job `if`, and
#     verifyDispatchLaunchRequest re-checks the same ref. These are hygiene for the UNMODIFIED
#     workflow only, NOT a trust boundary (Stage 1 review on #1097): GitHub runs the workflow
#     version at the dispatch-selected ref, so a repository writer can dispatch a branch whose copy
#     of this file drops the guard. The enforceable boundary is outside this file: the job declares
#     `environment: ldl-launcher`, and the founder keeps CLAUDE_CODE_OAUTH_TOKEN as an environment
#     secret of that environment (not a repository secret) with deployment branches restricted to
#     the default branch, so a non-default-ref run is denied the secret by GitHub itself.
#     Checkout is the triggering ref of THIS repository; no fork or PR-head code is checked out.
#   - Event-derived values reach the shell only through env, never interpolated into
#     script text.
#   - Permissions: issues write (claim comments, control-body writes), actions read (liveness
#     read-back), and contents/pull-requests write ONLY because the clean-Stage-1 continuation
#     merges the exact authorized head (gh pr merge --match-head-commit) after merge-ready-gate.
#   - Secrets: GITHUB_TOKEN, plus the founder-provisioned CLAUDE_CODE_OAUTH_TOKEN (issue #906; a
#     Claude subscription OAuth token, never a metered API key). It is handed to the launch script
#     under LDL_WORKER_CLAUDE_OAUTH_TOKEN, scrubbed from every gate/gh/git child environment, and
#     given only to the built-in qualified worker (never a custom LDL_WORKER_COMMAND, never a PR-head checkout) after a read-only authenticated smoke check; the CLI is installed only when that path is selected.
#     Absent or unqualified, the launcher keeps its documented WAITING / manual-relaunch fallback.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      control_issue:
        description: Control issue number (the only input needed; your Run workflow press is the launch request)
        required: true
      nonce:
        description: Legacy only - leave empty. A Launch Authorization nonce selects the legacy comment-authorized path.
        required: false
        default: ""
      diagnostic_only:
        description: Read-only hosted isolation diagnostic ONLY (no launch, claim, credential, or worker; control_issue is ignored - enter any number). Leave unchecked to launch.
        type: boolean
        required: false
        default: false
      post_install_diagnostic:
        description: POST-INSTALL hosted isolation diagnostic ONLY (issue #1143; installs just bubblewrap+socat on the disposable runner, then runs the unchanged unprivileged bwrap probe; no launch, claim, credential, or worker; control_issue is ignored - enter any number). Mutually exclusive with diagnostic_only; setting both runs nothing. Leave unchecked to launch.
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ldl-launcher-${{ inputs.diagnostic_only && 'diagnostic' || inputs.post_install_diagnostic && 'diagnostic-post-install' || github.event.issue.number || inputs.control_issue }}
  cancel-in-progress: false

jobs:
  authorize-and-claim:
    # Hygiene guard (Audit #1096), not a trust boundary: the unmodified workflow does not START for
    # a dispatch on a non-default ref. A modified branch copy can omit this `if`, so the secret's
    # protection is the `ldl-launcher` environment's default-branch deployment policy (see header).
    # A diagnostic_only or post_install_diagnostic dispatch NEVER enters this job (issues #1139,
    # #1143): each is served solely by a credential-free diagnostic job below, whatever its result.
    if: >-
      inputs.diagnostic_only != true &&
      inputs.post_install_diagnostic != true &&
      ((github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       startsWith(github.event.comment.body, '/ldl launch ')))
    runs-on: ubuntu-latest
    environment: ldl-launcher
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify trigger, authorization, and claim
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          # The identity that pressed Run workflow / Re-run (differs from ACTOR on a re-run).
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IS_FORK: ${{ github.event.repository.fork }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_CONTROL_ISSUE: ${{ inputs.control_issue }}
          INPUT_NONCE: ${{ inputs.nonce }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # Repository configuration (a non-secret Actions variable), never a launcher-added secret:
          # JSON argv array that runs ONE fresh bounded worker with the dispatch prompt on stdin.
          LDL_WORKER_COMMAND: ${{ vars.LDL_WORKER_COMMAND }}
          # Default 4h in-job deterministic wait (canonical poller, no model session) so a reviewer
          # response arriving after the supervisor would otherwise stop at WAITING is consumed in
          # the same authorized, claimed run (a settled nonce is never replayed).
          LDL_WAIT_BUDGET_MS: ${{ vars.LDL_WAIT_BUDGET_MS || '14400000' }}
          LDL_WORKER_CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          import { parseLaunchAuthorization, verifyTrustedTrigger, verifyDispatchLaunchRequest, resolveDispatchExecution, buildDispatchAuthorization, renderDispatchLaunchRecord } from "./tools/orchestration/launch-authorization.mjs";
          import { TRANSITIONS, OPEN_PATH_STATES } from "./tools/orchestration/launcher-step.mjs";
          import { parseAttemptClaims, planClaim, renderClaimBody, formatAttemptId, parseAttemptId } from "./tools/orchestration/attempt-claim.mjs";

          // Capture then scrub the worker credential so no gh/git/gate child inherits it; only the
          // launcher-run child receives it, and it forwards it solely to the qualified worker.
          const workerToken = process.env.LDL_WORKER_CLAUDE_OAUTH_TOKEN;
          delete process.env.LDL_WORKER_CLAUDE_OAUTH_TOKEN;
          const env = process.env;
          const gh = (...args) => execFileSync("gh", args, { encoding: "utf8" });
          const api = (path) => JSON.parse(gh("api", path));
          const fail = (msg) => { console.log(`LAUNCH REFUSED: ${msg}`); process.exit(0); };

          const isDispatch = env.EVENT_NAME === "workflow_dispatch";
          // A dispatch carrying no nonce is the control-issue-only launch request (issue #1094); a
          // dispatch that supplies a nonce stays on the legacy comment-authorized path unchanged.
          const requestMode = isDispatch && (env.INPUT_NONCE ?? "").trim() === "";
          const controlIssue = Number(isDispatch ? env.INPUT_CONTROL_ISSUE : env.ISSUE_NUMBER);
          if (!Number.isInteger(controlIssue) || controlIssue <= 0) fail("no control issue");

          const permCache = new Map();
          const permission = (login) => {
            if (!permCache.has(login)) {
              try { permCache.set(login, api(`repos/${env.REPO}/collaborators/${login}/permission`).permission); }
              catch { permCache.set(login, "none"); }
            }
            return permCache.get(login);
          };

          // --paginate --slurp reads EVERY page of the control issue's comments: a newer conflicting
          // request or an existing attempt claim on a later page must not be missed.
          const pages = JSON.parse(gh("api", "--paginate", "--slurp", `repos/${env.REPO}/issues/${controlIssue}/comments?per_page=100`));
          const comments = pages.flat().map((c) => ({
            id: c.id, body: c.body, author: c.user?.login, authorPermission: permission(c.user?.login),
          }));

          let auth;
          let gateState = null;
          if (requestMode) {
            // The CURRENT repository permission, read from GitHub, of the identity that actually
            // pressed Run workflow / Re-run; no caller-supplied field is trusted.
            const initiator = env.TRIGGERING_ACTOR || env.ACTOR;
            const requestFor = (who) => verifyDispatchLaunchRequest({
              name: env.EVENT_NAME, action: "dispatch", actor: who, actorPermission: permission(who),
              isFork: env.IS_FORK !== "false", ref: env.EVENT_REF, defaultBranch: env.DEFAULT_BRANCH,
              inputs: { control_issue: env.INPUT_CONTROL_ISSUE },
            });
            const request = requestFor(initiator);
            if (!request.trusted) fail(`untrusted dispatch: ${request.reason}`);
            // A re-run by a different person must not borrow the original dispatcher's authority.
            if (env.ACTOR !== initiator && !requestFor(env.ACTOR).trusted) fail("untrusted dispatch: original dispatcher is not a current writer");
            // The gate freshens the control plane over git, so credentials are set up first.
            execFileSync("gh", ["auth", "setup-git"], { encoding: "utf8" });
            let verdict;
            try {
              const gateOut = execFileSync("node", ["tools/orchestration/control-plane-bootstrap.mjs", "session-entry-gate", "--control-issue", String(controlIssue)],
                { encoding: "utf8", maxBuffer: 64 * 1024 * 1024, stdio: ["ignore", "pipe", "inherit"] });
              verdict = JSON.parse(gateOut.trim().split("\n").pop());
            } catch (e) { fail(`gate unavailable: ${String(e.message).split("\n")[0]}`); }
            const resolved = resolveDispatchExecution(verdict, { controlIssue, launchableStates: new Set([...Object.keys(TRANSITIONS), ...OPEN_PATH_STATES]) });
            if (resolved.status !== "RESOLVED") fail(`control not dispatchable: ${resolved.reason}`);
            gateState = resolved.state;
            const built = buildDispatchAuthorization({ controlIssue, executionIssue: resolved.executionIssue, initiator, runId: env.RUN_ID });
            if (!built) fail("could not form a dispatch request identity");
            auth = { status: "LAUNCH_REQUESTED", authorization: built };
          } else {
            auth = parseLaunchAuthorization(comments, { controlIssue });
            if (auth.status !== "LAUNCH_REQUESTED") fail(`authorization ${auth.status}: ${auth.reason}`);
          }

          const trigger = requestMode ? { trusted: true } : verifyTrustedTrigger({
            name: env.EVENT_NAME,
            action: isDispatch ? "dispatch" : env.EVENT_ACTION,
            actor: env.ACTOR,
            actorPermission: permission(env.ACTOR),
            isFork: false, // same-repo events only: issue_comment/workflow_dispatch never run fork code
            isPullRequest: isDispatch ? false : env.IS_PR === "true",
            issueNumber: isDispatch ? controlIssue : Number(env.ISSUE_NUMBER),
            commentBody: env.COMMENT_BODY,
            inputs: { control_issue: env.INPUT_CONTROL_ISSUE, nonce: env.INPUT_NONCE },
          }, { authorization: auth.authorization });
          if (!trigger.trusted) fail(`untrusted trigger: ${trigger.reason}`);

          // Liveness comes from the Actions run API, never from claim text.
          const claims = parseAttemptClaims(comments);
          const liveness = {};
          for (const c of claims) {
            // Exact run attempt: a rerun (123-2) must not inherit the status of the claimed 123-1.
            const id = parseAttemptId(c.attemptId);
            if (!id) continue; // malformed id stays unknown -> fail closed
            try {
              const run = api(`repos/${env.REPO}/actions/runs/${id.runId}/attempts/${id.runAttempt}`);
              liveness[c.attemptId] = { status: run.status, conclusion: run.conclusion };
            } catch { /* unknown stays unknown -> fail closed */ }
          }

          const attemptId = formatAttemptId(env.RUN_ID, env.RUN_ATTEMPT);
          const plan = planClaim(claims, liveness, { attemptId, nonce: auth.authorization.nonce });
          if (plan.action !== "CLAIM" && plan.action !== "RECONCILE_THEN_CLAIM") fail(`${plan.action}: ${plan.reason}`);

          // Durable, auditable request record (initiator, control, execution, attempt) BEFORE the claim.
          if (requestMode) {
            execFileSync("gh", ["api", `repos/${env.REPO}/issues/${controlIssue}/comments`, "-F", "body=@-"], {
              input: renderDispatchLaunchRecord({ authorization: auth.authorization, attemptId, state: gateState, requestedAt: new Date().toISOString() }),
              encoding: "utf8",
            });
          }
          const body = renderClaimBody({
            attemptId, nonce: auth.authorization.nonce, claimedAt: new Date().toISOString(),
            runner: "github-actions", phase: "CLAIMED",
          });
          execFileSync("gh", ["api", `repos/${env.REPO}/issues/${controlIssue}/comments`, "-F", "body=@-"],
            { input: body, encoding: "utf8" });
          console.log(`LAUNCH CLAIMED: attempt ${attemptId} (${plan.action}) for control #${controlIssue}`);

          // Advance: run the launcher SUPERVISOR for the requested control/execution issue. It carries
          // this one authorization through fresh-worker dispatches, resumes from durable state at each
          // breakpoint, and returns only at a genuine terminal / waiting / fail-closed boundary. A
          // thrown error leaves the claim open so the next trigger reconciles it as ORPHANED.
          // Workers commit and push as the Actions identity using the job token (no persisted checkout credential).
          // Install the pinned Claude Code CLI only now: the trigger is trusted and claimed, and the
          // built-in OAuth worker path is the one actually selected (secret present, no custom
          // LDL_WORKER_COMMAND). An install failure drops the credential and keeps the WAITING fallback.
          let launchToken = workerToken;
          if (launchToken && !env.LDL_WORKER_COMMAND) {
            try {
              execFileSync("sudo", ["npm", "install", "-g", "@anthropic-ai/claude-code@2.1.285"], { encoding: "utf8", stdio: ["ignore", "ignore", "inherit"] });
            } catch {
              console.log("CLAUDE CLI INSTALL FAILED: continuing without the OAuth worker (WAITING fallback)");
              launchToken = undefined;
            }
            if (launchToken) {
              // Runner isolation preflight (issue #1108): the actual worker runs with
              // CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1, which needs bubblewrap (and socat) plus a working
              // unprivileged user namespace. Install and functional probe run here, AFTER the
              // trusted/claimed checks and BEFORE the worker, in a credential-free child env (the
              // token lives only in launchToken, never in process.env). No sysctl, AppArmor, or
              // scrub change is ever made: on failure the credential is dropped (WAITING fallback)
              // and the worker is never started unisolated.
              // Allowlisted env: no job token (GH_TOKEN/GITHUB_TOKEN), runner credential, or worker secret reaches these children.
              const isoEnv = {};
              for (const k of ["PATH", "HOME", "USER", "LANG", "LC_ALL", "TMPDIR", "DEBIAN_FRONTEND"]) if (process.env[k] !== undefined) isoEnv[k] = process.env[k];
              const iso = (cmd, args, timeout) => execFileSync(cmd, args, { encoding: "utf8", env: isoEnv, stdio: ["ignore", "ignore", "inherit"], timeout });
              try {
                iso("sudo", ["apt-get", "update", "-qq"], 180000);
                iso("sudo", ["apt-get", "install", "-y", "-qq", "bubblewrap", "socat"], 300000);
                iso("bwrap", ["--version"], 15000);
                iso("socat", ["-V"], 15000);
                // Functional probe as the same unprivileged runner account (no sudo).
                iso("bwrap", ["--unshare-all", "--ro-bind", "/", "/", "--dev", "/dev", "--proc", "/proc", "true"], 30000);
                console.log("RUNNER ISOLATION PREFLIGHT PASSED: bubblewrap installed and unprivileged bwrap probe succeeded");
              } catch (e) {
                let userns = "unreadable";
                try { userns = readFileSync("/proc/sys/kernel/apparmor_restrict_unprivileged_userns", "utf8").trim().slice(0, 200); } catch { /* read-only diagnostic */ }
                console.log(`RUNNER ISOLATION PREFLIGHT FAILED: ${String(e.message).split("\n")[0].slice(0, 500)} (apparmor_restrict_unprivileged_userns=${userns}); worker not started, no isolation weakening applied; a policy change needs founder approval (WAITING fallback)`);
                launchToken = undefined; // fail closed first; diagnostics below can never leave the credential in place
                // Read-only host diagnostics (issue #1118 unit C, founder-approved #1120 Q1=A): facts only,
                // recorded on this failed trusted path, in the credential-free child env. Nothing is
                // loaded, copied, removed, or changed; anything absent or permission-denied is "unavailable".
                const fact = (cmd, args) => {
                  try {
                    return execFileSync(cmd, args, { encoding: "utf8", env: isoEnv, stdio: ["ignore", "pipe", "ignore"], timeout: 15000 }).trim();
                  } catch { return "unavailable"; }
                };
                const lines = (text, re, max) => (text === "unavailable" ? "unavailable" : text.split("\n").filter((l) => re.test(l)).slice(0, max).map((l) => l.slice(0, 400)));
                let osRelease = "unavailable";
                try { osRelease = readFileSync("/etc/os-release", "utf8").split("\n").filter((l) => /^(PRETTY_NAME|VERSION_ID)=/.test(l)).map((l) => l.slice(0, 200)).join(" ").slice(0, 600); } catch { /* unavailable */ }
                const profilePaths = ["/etc/apparmor.d/bwrap-userns-restrict", "/usr/share/apparmor/extra-profiles/bwrap-userns-restrict", "/etc/apparmor.d/bwrap"];
                const hashes = profilePaths.map((p) => `${p}=${(fact("sha256sum", [p]).split(/\s+/)[0] || "unavailable").slice(0, 64)}`);
                // Per-field budgets so the whole line fits the hard cap and no trailing field (apparmor_denied) is ever starved:
                // 600+200+200+1000+~450+2000+3000+4000 plus labels is well under 16000.
                const cap = (v, n) => (typeof v === "string" ? v.slice(0, n) : v);
                const capJson = (v, n) => JSON.stringify(v).slice(0, n);
                const listParts = [lines(fact("ls", ["-1", "/etc/apparmor.d"]), /bwrap|bubblewrap/i, 20), lines(fact("ls", ["-1", "/usr/share/apparmor/extra-profiles"]), /bwrap|bubblewrap/i, 20)];
                const listed = listParts.some((x) => x === "unavailable") ? "unavailable" : listParts.flat();
                const dm = lines(fact("dmesg", []), /apparmor="DENIED"/i, Infinity);
                const denied = dm === "unavailable" ? "unavailable" : dm.filter((l) => /bwrap|bubblewrap|userns/i.test(l)).slice(0, 20);
                const diagnosticsPayload = `RUNNER ISOLATION DIAGNOSTICS (read-only): os=${osRelease}; kernel=${cap(fact("uname", ["-r"]), 200)}; apparmor_restrict_unprivileged_userns=${userns}; packages=${cap(fact("dpkg-query", ["-W", "-f=${Package}=${Version} ", "bubblewrap", "apparmor"]), 1000)}; bwrap_profile_hashes=[${hashes.join(", ")}]; bwrap_profile_names=${capJson(listed, 2000)}; aa-status=${capJson(fact("aa-status", []), 3000)}; apparmor_denied=${capJson(denied, 4000)}`;
                console.log(diagnosticsPayload.slice(0, 16000)); // whole-line hard cap
              }
            }
          } else {
            launchToken = undefined; // a custom LDL_WORKER_COMMAND never receives the credential
          }
          if (!requestMode) execFileSync("gh", ["auth", "setup-git"], { encoding: "utf8" });
          execFileSync("git", ["config", "user.name", "github-actions[bot]"]);
          execFileSync("git", ["config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"]);
          const out = execFileSync("node", [
            "tools/orchestration/launcher-run.mjs",
            "--control-issue", String(controlIssue),
            "--execution-issue", String(auth.authorization.executionIssue),
          ], { encoding: "utf8", maxBuffer: 256 * 1024 * 1024, stdio: ["ignore", "pipe", "inherit"], env: { ...process.env, ...(launchToken ? { LDL_WORKER_CLAUDE_OAUTH_TOKEN: launchToken } : {}) } });
          const step = JSON.parse(out.trim().split("\n").pop());
          console.log(`LAUNCH RESULT: ${step.outcome} ${JSON.stringify(step.evidence ?? {})}`);
          // Settle (consume the nonce) ONLY now: the supervisor returned a durable boundary.
          const settled = renderClaimBody({
            attemptId, nonce: auth.authorization.nonce, claimedAt: new Date().toISOString(),
            runner: "github-actions", phase: "DONE", outcome: String(step.outcome).replace(/[^A-Z_]/g, ""),
          });
          execFileSync("gh", ["api", `repos/${env.REPO}/issues/${controlIssue}/comments`, "-F", "body=@-"],
            { input: settled, encoding: "utf8" });
          JS

  # Diagnostic-only entry point (issue #1139, founder-approved #1120 Q1=A). Logically disjoint from
  # the launch job: no environment (so no deployment secret), no repository checkout, an empty job
  # token permission set, no steps that authorize, claim, install, or launch anything, and it only
  # runs for an explicit diagnostic_only dispatch. Read-only facts, bounded and nonsecret; every
  # child process gets an allowlisted environment; absent or unreadable facts are "unavailable".
  # It installs nothing, so a missing bubblewrap is reported as a limit, never as the prior
  # post-install runner state. Hygiene `if` as above; the job holds no credential either way.
  isolation-diagnostic:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.diagnostic_only == true &&
      inputs.post_install_diagnostic != true &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Read-only isolation diagnostic
        run: |
          node --input-type=module <<'DIAG'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const dEnv = {};
          for (const k of ["PATH", "HOME", "USER", "LANG", "LC_ALL", "TMPDIR"]) if (process.env[k] !== undefined) dEnv[k] = process.env[k];
          const fact = (cmd, args) => {
            try {
              return execFileSync(cmd, args, { encoding: "utf8", env: dEnv, stdio: ["ignore", "pipe", "ignore"], timeout: 15000 }).trim();
            } catch { return "unavailable"; }
          };
          const proc = (p) => { try { return readFileSync(p, "utf8").trim().slice(0, 200); } catch { return "unavailable"; } };
          const cap = (v, n) => (typeof v === "string" ? v.slice(0, n) : v);
          const capJson = (v, n) => JSON.stringify(v).slice(0, n);
          const lines = (text, re, max) => (text === "unavailable" ? "unavailable" : text.split("\n").filter((l) => re.test(l)).slice(0, max).map((l) => l.slice(0, 400)));
          let osRelease = "unavailable";
          try { osRelease = readFileSync("/etc/os-release", "utf8").split("\n").filter((l) => /^(PRETTY_NAME|VERSION_ID)=/.test(l)).map((l) => l.slice(0, 200)).join(" ").slice(0, 600); } catch { /* unavailable */ }
          const profilePaths = ["/etc/apparmor.d/bwrap-userns-restrict", "/usr/share/apparmor/extra-profiles/bwrap-userns-restrict", "/etc/apparmor.d/bwrap"];
          const hashes = profilePaths.map((p) => `${p}=${(fact("sha256sum", [p]).split(/\s+/)[0] || "unavailable").slice(0, 64)}`);
          const listParts = [lines(fact("ls", ["-1", "/etc/apparmor.d"]), /bwrap|bubblewrap/i, 20), lines(fact("ls", ["-1", "/usr/share/apparmor/extra-profiles"]), /bwrap|bubblewrap/i, 20)];
          const listed = listParts.every((x) => x === "unavailable") ? "unavailable" : listParts.map((x) => (x === "unavailable" ? "source-unavailable" : x)).flat();
          const dm = lines(fact("dmesg", []), /apparmor="DENIED"/i, Infinity);
          const denied = dm === "unavailable" ? "unavailable" : dm.filter((l) => /bwrap|bubblewrap|userns/i.test(l)).slice(0, 20);
          // The unchanged functional probe, only when bwrap is already present (nothing is installed).
          let probe = "skipped: bwrap not installed (this route installs nothing; not the prior post-install state)";
          if (fact("bwrap", ["--version"]) !== "unavailable") {
            try {
              execFileSync("bwrap", ["--unshare-all", "--ro-bind", "/", "/", "--dev", "/dev", "--proc", "/proc", "true"], { encoding: "utf8", env: dEnv, stdio: ["ignore", "ignore", "pipe"], timeout: 30000 });
              probe = "passed";
            } catch (e) { probe = `failed: ${String(e.stderr || e.message).split("\n")[0].slice(0, 500)}`; }
          }
          const userns = `apparmor_restrict_unprivileged_userns=${proc("/proc/sys/kernel/apparmor_restrict_unprivileged_userns")} unprivileged_userns_clone=${proc("/proc/sys/kernel/unprivileged_userns_clone")} max_user_namespaces=${proc("/proc/sys/user/max_user_namespaces")}`;
          const payload = `HOSTED ISOLATION DIAGNOSTIC (read-only, credential-free, no worker): os=${osRelease}; kernel=${cap(fact("uname", ["-r"]), 200)}; ${userns}; packages=${["bubblewrap", "apparmor"].map((pk) => `${pk}=${cap(fact("dpkg-query", ["-W", "-f=${Version}", pk]), 200)}`).join(" ")}; bwrap_profile_hashes=[${hashes.join(", ")}]; bwrap_profile_names=${capJson(listed, 2000)}; aa-status=${capJson(fact("aa-status", []), 3000)}; apparmor_denied=${capJson(denied, 4000)}; bwrap_probe=${probe}`;
          console.log(payload.slice(0, 16000));
          DIAG

  # Post-install diagnostic entry point (issue #1143, founder-approved one-shot under #1120). Same
  # credential-free posture as above (no environment, no checkout, empty token permissions, no
  # claim/worker path) but it MAY install exactly bubblewrap and socat, the original launcher
  # preflight's prerequisites, on the disposable runner. Before installing it simulates the install
  # and inspects the real .deb files; any AppArmor-referencing package, file, or maintainer script,
  # or any step it cannot complete, REFUSES the install (founder review) instead of guessing.
  # Explicit opt-in input, mutually exclusive with diagnostic_only and the launch job.
  post-install-isolation-diagnostic:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.post_install_diagnostic == true &&
      inputs.diagnostic_only != true &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 20
    steps:
      - name: Post-install isolation diagnostic
        run: |
          node --input-type=module <<'POSTDIAG'
          import { execFileSync } from "node:child_process";
          import { readFileSync, readdirSync, mkdtempSync } from "node:fs";
          import { createHash } from "node:crypto";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          const dEnv = {};
          for (const k of ["PATH", "HOME", "USER", "LANG", "LC_ALL", "TMPDIR", "DEBIAN_FRONTEND"]) if (process.env[k] !== undefined) dEnv[k] = process.env[k];
          const fact = (cmd, args) => {
            try {
              return execFileSync(cmd, args, { encoding: "utf8", env: dEnv, stdio: ["ignore", "pipe", "ignore"], timeout: 15000 }).trim();
            } catch { return "unavailable"; }
          };
          const proc = (p) => { try { return readFileSync(p, "utf8").trim().slice(0, 200); } catch { return "unavailable"; } };
          const cap = (v, n) => (typeof v === "string" ? v.slice(0, n) : v);
          const capJson = (v, n) => JSON.stringify(v).slice(0, n);
          const digest = (t) => (t === "unavailable" ? "unavailable" : createHash("sha256").update(t).digest("hex").slice(0, 16));
          const lines = (text, re, max) => (text === "unavailable" ? "unavailable" : text.split("\n").filter((l) => re.test(l)).slice(0, max).map((l) => l.slice(0, 400)));
          const first = (e) => String(e.stderr || e.message || e).split("\n")[0].slice(0, 300);
          const snapshot = () => {
            let osRelease = "unavailable";
            try { osRelease = readFileSync("/etc/os-release", "utf8").split("\n").filter((l) => /^(PRETTY_NAME|VERSION_ID)=/.test(l)).map((l) => l.slice(0, 200)).join(" ").slice(0, 600); } catch { /* unavailable */ }
            const profilePaths = ["/etc/apparmor.d/bwrap-userns-restrict", "/usr/share/apparmor/extra-profiles/bwrap-userns-restrict", "/etc/apparmor.d/bwrap"];
            const hashes = profilePaths.map((p) => `${p}=${(fact("sha256sum", [p]).split(/\s+/)[0] || "unavailable").slice(0, 64)}`);
            const dirList = fact("ls", ["-1", "/etc/apparmor.d"]);
            const dirContent = fact("find", ["/etc/apparmor.d", "-type", "f", "-exec", "sha256sum", "{}", "+"]);
            const dirContentSorted = dirContent === "unavailable" ? dirContent : dirContent.split("\n").sort().join("\n");
            const listParts = [lines(dirList, /bwrap|bubblewrap/i, 20), lines(fact("ls", ["-1", "/usr/share/apparmor/extra-profiles"]), /bwrap|bubblewrap/i, 20)];
            const listed = listParts.every((x) => x === "unavailable") ? "unavailable" : listParts.map((x) => (x === "unavailable" ? "source-unavailable" : x)).flat();
            const aa = fact("aa-status", []);
            const profilesLoaded = aa === "unavailable" ? "unavailable" : aa.split(/^\d+ processes/m)[0];
            const dm = lines(fact("dmesg", []), /apparmor="DENIED"/i, Infinity);
            const denied = dm === "unavailable" ? "unavailable" : dm.filter((l) => /bwrap|bubblewrap|userns/i.test(l)).slice(0, 20);
            const userns = `apparmor_restrict_unprivileged_userns=${proc("/proc/sys/kernel/apparmor_restrict_unprivileged_userns")} unprivileged_userns_clone=${proc("/proc/sys/kernel/unprivileged_userns_clone")} max_user_namespaces=${proc("/proc/sys/user/max_user_namespaces")}`;
            const packages = ["bubblewrap", "socat", "apparmor"].map((pk) => `${pk}=${cap(fact("dpkg-query", ["-W", "-f=${Version}", pk]), 200)}`).join(" ");
            // Policy-relevant facts compared pre/post; each is "unavailable" when unreadable.
            const policy = { userns, profile_hashes: hashes.join(","), apparmor_d_digest: digest(dirContentSorted), profiles_loaded_digest: digest(profilesLoaded) };
            const text = `os=${osRelease}; kernel=${cap(fact("uname", ["-r"]), 200)}; ${userns}; packages=${packages}; bwrap_profile_hashes=[${hashes.join(", ")}]; apparmor_d_digest=${policy.apparmor_d_digest}; bwrap_profile_names=${capJson(listed, 1000)}; aa-status=${capJson(aa, 2000)}; profiles_loaded_digest=${policy.profiles_loaded_digest}; apparmor_denied=${capJson(denied, 1500)}`;
            return { policy, text: text.slice(0, 7000) };
          };
          const PKGS = ["bubblewrap", "socat"];
          const PROBE = ["--unshare-all", "--ro-bind", "/", "/", "--dev", "/dev", "--proc", "/proc", "true"];
          const pre = snapshot();
          let install = "not-attempted";
          let refusal = null;
          // 1. Establish apt lists, then simulate and inspect the exact packages before any install.
          const staged = [];
          try {
            execFileSync("sudo", ["apt-get", "update", "-qq"], { encoding: "utf8", env: dEnv, stdio: ["ignore", "ignore", "pipe"], timeout: 180000 });
            const sim = execFileSync("apt-get", ["-s", "install", "-y", "-qq", "--no-remove", ...PKGS], { encoding: "utf8", env: dEnv, stdio: ["ignore", "pipe", "pipe"], timeout: 60000 });
            const removal = sim.split("\n").find((l) => /^(Remv|Purg) /.test(l));
            if (removal) throw new Error(`install plan includes a package removal: ${removal.slice(0, 80)}`);
            const plan = sim.split("\n").map((l) => /^Inst (\S+)/.exec(l)?.[1]).filter(Boolean);
            if (plan.length > 40) throw new Error(`install plan too large to inspect (${plan.length} packages)`);
            const hit = plan.find((n) => /apparmor/i.test(n));
            if (hit) throw new Error(`install plan includes apparmor package ${hit}`);
            if (plan.length > 0) {
              const dir = mkdtempSync(join(tmpdir(), "ldl-debs-"));
              execFileSync("apt-get", ["download", ...plan], { encoding: "utf8", env: dEnv, cwd: dir, stdio: ["ignore", "ignore", "pipe"], timeout: 180000 });
              const debs = readdirSync(dir).filter((f) => f.endsWith(".deb"));
              if (debs.length !== plan.length) throw new Error(`downloaded ${debs.length} of ${plan.length} planned packages`);
              for (const f of debs) {
                const deb = join(dir, f);
                const contents = execFileSync("dpkg-deb", ["-c", deb], { encoding: "utf8", env: dEnv, stdio: ["ignore", "pipe", "pipe"], timeout: 30000 });
                if (/apparmor/i.test(contents)) throw new Error(`${f} ships apparmor-related paths`);
                const ctl = join(dir, `ctl-${f}`);
                execFileSync("dpkg-deb", ["-e", deb, ctl], { encoding: "utf8", env: dEnv, stdio: ["ignore", "ignore", "pipe"], timeout: 30000 });
                for (const name of readdirSync(ctl)) {
                  if (!/^(preinst|postinst|prerm|postrm|triggers|config)$/.test(name)) continue;
                  if (/apparmor|aa-(enforce|complain|disable|status)/i.test(readFileSync(join(ctl, name), "utf8"))) throw new Error(`${f} ${name} references apparmor`);
                }
                staged.push(f.slice(0, 80));
              }
            }
          } catch (e) { refusal = first(e); }
          let probe = "skipped";
          if (refusal) {
            install = `refused-before-install: ${refusal} (cannot rule out a policy side effect; founder review required; nothing installed)`;
          } else {
            try {
              execFileSync("sudo", ["apt-get", "install", "-y", "-qq", "--no-remove", ...PKGS], { encoding: "utf8", env: dEnv, stdio: ["ignore", "ignore", "pipe"], timeout: 300000 });
              install = `ok (inspected ${staged.length} package files; none reference apparmor)`;
            } catch (e) { install = `failed: ${first(e)}`; }
          }
          // 2. Post-install facts and the EXACT unchanged unprivileged probe (no sudo), only after install.
          if (install.startsWith("ok")) {
            if (fact("bwrap", ["--version"]) === "unavailable") probe = "unavailable: bwrap --version failed after install";
            else {
              try {
                execFileSync("bwrap", PROBE, { encoding: "utf8", env: dEnv, stdio: ["ignore", "ignore", "pipe"], timeout: 30000 });
                probe = "passed";
              } catch (e) { probe = `failed: exit=${e.status ?? "none"} signal=${e.signal ?? "none"} stderr=${String(e.stderr || e.message || e).replace(/\s*\n\s*/g, " | ").slice(0, 500)}`; }
            }
          } else probe = "skipped: install did not complete";
          // Snapshot after the probe so a denial produced by the probe itself is captured.
          const post = snapshot();
          const changed = [];
          const unknown = [];
          for (const k of Object.keys(pre.policy)) {
            if (pre.policy[k] === post.policy[k]) { if (/unavailable/.test(post.policy[k])) unknown.push(k); }
            else if (/unavailable/.test(pre.policy[k]) || /unavailable/.test(post.policy[k])) unknown.push(k);
            else changed.push(k);
          }
          const policyChange = changed.length ? `BOUNDARY VIOLATION: changed=[${changed.join(",")}] (not authorized; report as limitation)` : `none-observed (uncheckable=[${unknown.join(",")}])`;
          console.log(`HOSTED POST-INSTALL ISOLATION DIAGNOSTIC pre-install (credential-free, no worker): ${pre.text}`);
          console.log(`HOSTED POST-INSTALL ISOLATION DIAGNOSTIC post-install (credential-free, no worker): ${post.text}`);
          console.log(`HOSTED POST-INSTALL ISOLATION DIAGNOSTIC result (credential-free, no worker; only ${PKGS.join("+")} may be installed): install=${install.slice(0, 600)}; policy_change=${policyChange.slice(0, 400)}; bwrap_probe=${probe}`.slice(0, 2000));
          if (refusal || !install.startsWith("ok") || changed.length) process.exitCode = 1;
          POSTDIAG
