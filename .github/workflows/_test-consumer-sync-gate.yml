name: (temporary) consumer-sync-gate empirical trigger test

# Throwaway workflow_dispatch-only workflow used once to empirically answer issue #274's
# central open question: does the chatgpt-codex-connector[bot] GitHub App respond to a
# Stage 1 `@codex review` trigger comment authored by the default GITHUB_TOKEN (i.e.
# github-actions[bot]), the same way it responds to a human-authored one? Removed once that
# question is answered and the finding is recorded in docs/consumer-contract.md and the PR
# that introduces tools/review-watch/consumer-sync-gate.mjs.

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  test:
    # workflow_dispatch needs the workflow file already on the default branch to be
    # discoverable via API/CLI (a separate GitHub limitation from this issue's own
    # native-trigger question) -- pull_request:synchronize runs from the PR branch's own
    # workflow definition instead, so this throwaway probe can run before merge.
    if: github.event.pull_request.number != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run consumer-sync-gate.mjs as github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/review-watch/consumer-sync-gate.mjs \
            --repo "$GITHUB_REPOSITORY" --pr "${{ github.event.pull_request.number }}" --set-status true
