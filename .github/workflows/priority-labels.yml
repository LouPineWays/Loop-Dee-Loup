name: Priority labels

# Loop-Dee-Loup's own backlog lives on GitHub Issues as priority:now / priority:soon /
# priority:later / priority:wishes labels rather than a separate ordinal file (see
# docs/priority-horizons.md). Idea-intake issues expose that same choice as a structured
# "Priority horizon" field; this workflow deterministically projects the selected value
# into exactly one priority:* label, then runs the existing integrity check for every issue.
on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  workflow_dispatch: {}

concurrency:
  group: priority-labels-${{ github.event.issue.number || 'manual' }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Project Idea intake priority horizon into its canonical label
        if: >-
          github.event.issue.number &&
          contains(github.event.issue.labels.*.name, 'idea-intake')
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";
            const match = body.match(/^### Priority horizon\s*\n+\s*(Now|Soon|Later|Wishes)\s*$/mi);

            if (!match) {
              core.setFailed(
                'idea-intake issue is missing a canonical "Priority horizon" value (Now / Soon / Later / Wishes)'
              );
              return;
            }

            const desired = `priority:${match[1].toLowerCase()}`;
            const current = issue.labels.map((label) =>
              typeof label === "string" ? label : label.name
            );
            const priorityLabels = current.filter((name) => name.startsWith("priority:"));

            for (const stale of priorityLabels) {
              if (stale === desired) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: stale,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (!current.includes(desired)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [desired],
              });
            }

      - name: Check for conflicting priority-horizon labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.issue.number }}" ]; then
            node tools/check-priority-labels.mjs "${{ github.event.issue.number }}"
          else
            node tools/check-priority-labels.mjs
          fi
