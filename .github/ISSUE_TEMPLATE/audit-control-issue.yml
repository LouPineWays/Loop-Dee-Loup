name: Post-merge audit
description: Stage 2 read-only audit of one exact merge commit
title: "[Audit] "
labels: []
body:
  - type: markdown
    attributes:
      value: >-
        This issue is a read-only control boundary. Modify nothing in the target repository from
        this issue. Your role, allowed/prohibited actions, exact required response shape, and
        verdict semantics are defined in one place: **docs/stage2-audit-contract.md** — read it in
        full before auditing. docs/bounded-review-cycle.md Stage 2 covers lifecycle/procedure only.
  - type: input
    id: merged_pr
    attributes:
      label: Merged PR
      description: Link to the merged pull request being audited.
    validations:
      required: true
  - type: input
    id: work_issue
    attributes:
      label: Work issue
      description: >-
        The implementation issue this audit gates (e.g. "#151"). Read by
        tools/review-watch/lifecycle-gate.mjs's post-audit check as the sole structured
        source of which issue a CLEAN verdict here authorizes closing — per
        docs/bounded-review-cycle.md, merge alone never closes it. Never a closing
        keyword; this field is a plain reference, not a GitHub auto-close mechanism.
        Type the literal word "none" only when this audit genuinely has no gated
        implementation issue (e.g. an automated recurring consumer-sync PR) — post-audit
        reads that as the explicit no-work-issue state. Kept required, not left
        optional/blank: an optional field left blank by a forgotten entry would render
        GitHub's own "_No response_" indistinguishably from a deliberate declaration,
        letting a real work issue silently lose its premature-closure protection (Stage 1
        review finding on this PR). Do not type "none" merely because the work issue is
        inconvenient to find.
    validations:
      required: true
  - type: input
    id: merge_commit
    attributes:
      label: Exact merge commit
      description: The exact commit SHA on the target branch, not merely the PR head.
    validations:
      required: true
  - type: textarea
    id: inline_review
    attributes:
      label: Stage 1 inline review disposition
      description: Link the single inline review round and state how each valid finding was fixed.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Audit scope
      description: Complete current files, applicable instructions, and source-of-truth hierarchy covered by this audit.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Verification checklist instructions:** fill in the field below now, before triggering
        `@codex review` — a numbered, change-specific list of concrete checks against the exact
        merge commit above, derived from the actual diff and its acceptance criteria. Not generic
        prose ("review the code for bugs"); each item names a specific file/behavior/invariant to
        confirm, e.g. "1. Confirm `parseInput()` (src/foo.ts:42) rejects an empty string instead
        of throwing." The audit response must work through this list item by item — this
        paragraph renders permanently in the issue body (unlike field `description` text, which
        GitHub shows only in the authoring form and drops from the created issue) so the
        instructions reach the audit response even when it is triggered from a separate comment.
        If this PR touches a control-plane path (see `docs/bounded-review-cycle.md`'s Entry
        check), the checklist must include an item confirming that every workflow whose `paths:`
        trigger should match the diff actually shows a completed run — e.g. "N. Confirm
        `gh api repos/<owner>/<repo>/actions/runs?head_sha=<sha>` shows a completed run of
        `<workflow>.yml`." — not merely that the file contents are correct. Use the PR's frozen
        reviewed head SHA (Stage 1 step 2) for `<sha>`, not the merge commit recorded above:
        control-plane workflows trigger only on `pull_request`, so their runs are keyed to the PR
        branch's head SHA, and the merge commit created on `main` never appears as a `head_sha`
        even when CI ran and passed. A workflow whose trigger silently never matches (e.g. a
        broken `paths:` glob) will pass a content-only audit; this item exists to catch that class
        of defect. Keep this list to the number of genuinely independent checks the diff actually
        needs — group tightly related sub-checks (e.g. several failure-mode branches of the same
        function) under one numbered item rather than splitting them into many top-level items
        purely for enumeration's own sake. The response's completeness is judged by comparing its
        own walk-through count against this list's item count (issue #268 finding 2), with no
        credit for prose elsewhere in the response that covers a topic without a matching
        numbered/marker line — an oversized checklist can produce a mechanically-incomplete
        response even when the substance was genuinely covered (issue #335, audit #334).
  - type: textarea
    id: verification_checklist
    attributes:
      label: Verification checklist
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: markdown
    attributes:
      value: >-
        **Required response format:** replace "Pending" below with your completed audit report,
        in the exact shape defined by **docs/stage2-audit-contract.md** — read that document for
        the canonical CLEAN/NOT CLEAN skeleton, verdict semantics, and invalid-response examples.
        At minimum your response must restate the exact merge commit named above (the reviewed
        head alone does not satisfy this — issue #335, audit #334), walk through every item in
        the Verification checklist field below with a stated result, and end with an explicit
        `Verdict: CLEAN` or `Verdict: NOT CLEAN` line. `tools/review-watch/stage2-report.mjs`
        mechanically requires all three before this issue's Verdict dropdown can be promoted from
        a response — see docs/stage2-audit-contract.md § 7 for why this file is the single
        authority for response format, not this template.
  - type: textarea
    id: findings
    attributes:
      label: Findings
      description: Left as "Pending" when the issue is opened; the audit response fills this in per the required structure above.
      value: "Pending — awaiting Stage 2 audit response."
    validations:
      required: false
  - type: dropdown
    id: verdict
    attributes:
      label: Verdict
      description: Starts PENDING at issue creation; set by the audit response.
      options:
        - PENDING
        - CLEAN
        - NOT CLEAN
      default: 0
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: Next authorized action
      description: Pending audit before a verdict lands. On NOT CLEAN, first record "verify findings and prepare one consolidated correction PR," then replace with the PR link once it exists. On CLEAN, write None.
      value: "Pending audit."
    validations:
      required: false
