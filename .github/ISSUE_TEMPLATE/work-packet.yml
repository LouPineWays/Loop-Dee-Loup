name: Work packet
description: One independently verifiable Claude Code transaction
title: "[Packet] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Run this packet in one low-chatter session. Record evidence and the next state in GitHub, then stop."
  - type: input
    id: parent
    attributes:
      label: Parent loop
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Minimum required context
      description: Point to the current parent snapshot and essential repository files. Do not require comment history.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Required checks
    validations:
      required: true
  - type: textarea
    id: interrupt
    attributes:
      label: Interrupt conditions
      description: List only packet-specific additions to the operating model's founder interrupt conditions.
    validations:
      required: true
  - type: textarea
    id: stop
    attributes:
      label: Session stopping condition
      description: Define completion or escalation. Prepare the next packet but do not absorb a distinct context boundary.
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Durable completion handoff
      description: "Use STATUS, CHANGED, VERIFIED, DECISIONS, NEW RISKS, NEXT, PR. Keep this within 1,000–1,500 tokens; keep the chat summary much shorter."
