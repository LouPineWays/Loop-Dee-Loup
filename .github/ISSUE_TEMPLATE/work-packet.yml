name: Work packet
description: One independently verifiable agent transaction
title: "[Packet] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Execute only this packet. Record evidence and stop. The controller, not the founder, determines and dispatches the next packet."
  - type: input
    id: parent
    attributes:
      label: Parent loop
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Minimum required context
      description: Point to the current parent snapshot and essential repository files. Do not require comment history.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Required checks
    validations:
      required: true
  - type: textarea
    id: interrupt
    attributes:
      label: Interrupt conditions
      description: List only packet-specific additions to the operating model's founder interrupt conditions.
    validations:
      required: true
  - type: textarea
    id: stop
    attributes:
      label: Executor stopping condition
      description: Define completion or escalation. The executor must not begin the next packet.
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Completion handoff
      description: "Use STATUS, CHANGED, VERIFIED, DECISIONS, NEW RISKS, NEXT, PR. Keep the complete handoff within 1,000–1,500 tokens unless justified."
