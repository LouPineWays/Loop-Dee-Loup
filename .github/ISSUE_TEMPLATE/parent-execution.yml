name: Parent execution
description: Current-state controller for one founder-approved feature
title: "[Loop] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Keep this body as compressed current truth. Resume it from a fresh session with: Run Loop-Dee-Loup issue #X."
  - type: input
    id: source
    attributes:
      label: Source item
      description: Link or stable identifier for the originating proposal or source-queue item.
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: State
      options:
        - PROPOSED
        - NEEDS_FOUNDER
        - READY
        - EXECUTING
        - VERIFYING
        - REVIEW
        - AUDIT
        - CORRECTION
        - BLOCKED_FAILURE
        - BLOCKED_EXTERNAL
        - READY_NEXT_SESSION
        - DECOMPOSED
        - DONE
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Accepted outcome
      description: State the user or business result, not an implementation activity.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current state
      description: >-
        Current verified facts only. When this Issue is acting as a thin control Issue in
        the two-plane READY dispatch pattern (docs/operating-model.md § Two-plane Issue
        dispatch), also include explicit `- **Execution:** #N` and `- **Route:** <settled
        route>` bullet lines here — `tools/orchestration/ready-dispatch-gate.mjs` reads
        them, alongside this template's own State/Current blocker/Founder interrupt
        fields, to determine dispatch-readiness. Do not also add a `- **Lifecycle:**`
        bullet here — the State field above is already this control's one lifecycle
        representation, and repository tooling now fails closed on a body that carries
        both with disagreeing values.
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Settled decisions
      description: State decisions only; do not reproduce their discussion.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Minimum authority
      description: >-
        List only the issue bodies and repository files required for the next transition. When an
        execution Issue is currently active, point to it — do not paraphrase its requirements or
        acceptance criteria into this field. Write None, or only the applicable minimum authority,
        for a state with no active execution Issue (e.g. PROPOSED, NEEDS_FOUNDER, DECOMPOSED).
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Feature acceptance
    validations:
      required: true
  - type: textarea
    id: completed
    attributes:
      label: Completed packets
      description: One-line verified outcomes and links.
  - type: textarea
    id: blocker
    attributes:
      label: Current blocker
      description: >-
        Write None, or the current blocking condition — a failed gate, an external dependency,
        or a founder decision — regardless of whether it needs founder action. If the blocker is
        one or more currently-open GitHub Issues that will mechanically release this control once
        they reach their required terminal condition, write it as the exact recognized clause
        `Blocked by #N[, #N...].` and also add `- **Blocked lifecycle:** <value>` and
        `- **Blocked route:** <value-or-unchanged>` bullet lines recording the state to resume —
        `tools/orchestration/reconcile-control-blocker.mjs` can then clear the block and restore
        that state automatically once every named Issue closes (or, for an audit Issue, closes
        CLEAN); `tools/orchestration/write-control-snapshot.mjs` refuses to persist a Blocker
        field that names an Issue reference without this exact shape. Do not name an Issue
        reference in this field any other way — a genuine free-form/manual/external blocker with
        no Issue reference at all remains valid as ordinary prose and is never mechanically
        reconciled.
      value: "None"
    validations:
      required: true
  - type: textarea
    id: interrupt
    attributes:
      label: Founder interrupt
      description: Write None, or one concise unresolved question/manual action and why existing authority cannot settle it.
      value: "None"
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: Next slice / resulting slices
      description: >-
        Write None, or the single next slice this issue's own completion exposed as genuinely new
        follow-on work. If this issue required decomposition instead, list every currently
        foreseeable execution issue created from it plus a brief summary of dependencies between
        them (record those dependencies natively via GitHub's Blocked by/Blocking too, but
        summarize them here as well so a fresh reader of this closed issue is not forced to
        traverse every child), and set State to DECOMPOSED — this issue then closes as the durable
        decomposition record, not as a sequential pointer to "the next" child. Do not name only the
        first known slice while leaving others uncreated.
      value: "None"
    validations:
      required: true
